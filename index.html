<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>婚礼迎宾海报选择</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      background: linear-gradient(180deg, #faf8f5 0%, #f5f0e8 100%);
      min-height: 100vh;
      color: #3d3d3d;
    }

    .header {
      text-align: center;
      padding: 40px 24px 32px;
      background: linear-gradient(180deg, #fdfcfb 0%, transparent 100%);
    }

    .header h1 {
      font-size: 26px;
      font-weight: 600;
      color: #8b7355;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      color: #b8a890;
      letter-spacing: 1px;
    }

    /* 装饰线 */
    .header::after {
      content: '';
      display: block;
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #d4c4a8, transparent);
      margin: 20px auto 0;
    }

    .section {
      padding: 20px 16px 24px;
    }

    .section-title {
      font-size: 13px;
      color: #b8a890;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 20px;
    }

    /* 模板网格 - 中式简约风格 */
    .template-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 400px;
      margin: 0 auto;
    }

    .template-item {
      position: relative;
      aspect-ratio: 3/4;
      background: linear-gradient(145deg, #faf8f5 0%, #f0ebe3 100%);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid #e8e0d5;
    }

    .template-item.selected {
      border-color: #c9a96e;
      box-shadow: 0 4px 20px rgba(201, 169, 110, 0.25);
    }

    .template-item:active {
      transform: scale(0.98);
    }

    .template-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 12px;
    }

    .template-preview {
      flex: 1;
      background: linear-gradient(135deg, #f5f0e8 0%, #ebe4d8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* 模拟海报布局 */
    .poster-mock {
      width: 80%;
      height: 90%;
      background: linear-gradient(180deg, #fdfcfb 0%, #f8f4ed 100%);
      border: 1px solid #e8dfd3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .poster-mock.type-single .poster-img-area {
      width: 70%;
      height: 65%;
      background: linear-gradient(135deg, #e8e0d5 0%, #d8d0c5 100%);
      margin-bottom: 8px;
    }

    .poster-mock.type-dual {
      flex-direction: row;
      padding: 8px;
      gap: 6px;
    }

    .poster-mock.type-dual .poster-img-area {
      flex: 1;
      height: 100%;
      background: linear-gradient(135deg, #e8e0d5 0%, #d8d0c5 100%);
    }

    .poster-mock .poster-text-area {
      width: 60%;
      height: 8px;
      background: linear-gradient(90deg, #d4c4a8, #c9b896);
      border-radius: 2px;
      margin-top: 6px;
    }

    .poster-mock.type-dual .poster-text-area {
      display: none;
    }

    /* 装饰元素 */
    .poster-mock::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2px;
      background: #c9a96e;
      border-radius: 1px;
    }

    .template-info {
      padding: 10px 0 4px;
      text-align: center;
    }

    .template-name {
      font-size: 14px;
      color: #8b7355;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .template-slots {
      font-size: 11px;
      color: #b8a890;
      margin-top: 2px;
    }

    .template-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #c9a96e;
      color: white;
      padding: 3px 8px;
      border-radius: 2px;
      font-size: 10px;
      letter-spacing: 1px;
    }

    /* 预览区 */
    .preview-section {
      display: none;
      padding: 24px 20px;
      background: white;
      margin: 0 16px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(139, 115, 85, 0.1);
      border: 1px solid #f0ebe3;
    }

    .preview-section.show {
      display: block;
    }

    .preview-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .preview-title {
      font-size: 15px;
      color: #8b7355;
      letter-spacing: 2px;
    }

    .preview-subtitle {
      font-size: 12px;
      color: #b8a890;
      margin-top: 4px;
    }

    .preview-container {
      position: relative;
      max-width: 280px;
      margin: 0 auto;
      background: linear-gradient(180deg, #fdfcfb 0%, #f8f4ed 100%);
      aspect-ratio: 3/4;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      gap: 8px;
      padding: 16px;
      border: 1px solid #e8dfd3;
    }

    .preview-slot {
      flex: 1;
      background: linear-gradient(135deg, #f5f0e8 0%, #ebe4d8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 2px;
      border: 1px dashed #d4c4a8;
    }

    .preview-slot:hover {
      border-color: #c9a96e;
      background: #faf8f5;
    }

    .preview-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-placeholder {
      text-align: center;
      color: #c4b89c;
    }

    .preview-placeholder svg {
      width: 28px;
      height: 28px;
      margin-bottom: 4px;
      opacity: 0.6;
    }

    .preview-placeholder span {
      display: block;
      font-size: 11px;
      letter-spacing: 1px;
    }

    /* 上传框 */
    .upload-input {
      display: none;
    }

    /* 确认按钮 */
    .confirm-btn {
      display: block;
      width: calc(100% - 32px);
      margin: 0 16px 32px;
      padding: 15px 24px;
      background: linear-gradient(180deg, #c9a96e 0%, #b8955b 100%);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      letter-spacing: 3px;
      cursor: pointer;
      opacity: 0.4;
      pointer-events: none;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(201, 169, 110, 0.3);
    }

    .confirm-btn.active {
      opacity: 1;
      pointer-events: auto;
    }

    .confirm-btn.active:active {
      background: linear-gradient(180deg, #b8955b 0%, #a6854b 100%);
      transform: translateY(1px);
    }

    /* 结果展示 */
    .result-section {
      display: none;
      text-align: center;
      padding: 60px 24px;
    }

    .result-section.show {
      display: block;
    }

    .result-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #c9a96e 0%, #b8955b 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .result-icon svg {
      width: 36px;
      height: 36px;
      color: white;
    }

    .result-text {
      font-size: 18px;
      color: #8b7355;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    .result-sub {
      font-size: 13px;
      color: #b8a890;
      letter-spacing: 1px;
      line-height: 1.6;
    }

    /* 中式装饰边框 */
    .chinese-border {
      position: fixed;
      pointer-events: none;
    }

    .chinese-border.top {
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #d4c4a8, transparent);
    }

    .chinese-border.bottom {
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #d4c4a8, transparent);
    }
  </style>
</head>
<body>
  <div class="chinese-border top"></div>

  <div class="header">
    <h1>婚礼迎宾海报</h1>
    <p>选择喜欢的风格，上传照片预览</p>
  </div>

  <div class="section">
    <div class="section-title">— 模板选择 —</div>
    <div class="template-grid" id="templateGrid"></div>
  </div>

  <div class="preview-section" id="previewSection">
    <div class="preview-header">
      <div class="preview-title">上传婚纱照</div>
      <div class="preview-subtitle">点击下方区域选择照片</div>
    </div>
    <div class="preview-container" id="previewContainer"></div>
  </div>

  <button class="confirm-btn" id="confirmBtn" onclick="confirmSelection()">确认选择</button>

  <div class="result-section" id="resultSection">
    <div class="result-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <div class="result-text">已确认选择</div>
    <div class="result-sub">请截图此页面<br>发给设计师</div>
  </div>

  <div class="chinese-border bottom"></div>

  <script>
    // 模板数据 - 简约中式风格
    const templates = [
      {
        id: 1,
        name: '香槟极简',
        slots: 1,
        type: 'single',
        desc: '单图极简'
      },
      {
        id: 2,
        name: '素雅新中',
        slots: 1,
        type: 'single',
        desc: '单图新中式'
      },
      {
        id: 3,
        name: '温婉韩式',
        slots: 1,
        type: 'single',
        desc: '单图韩风'
      },
      {
        id: 4,
        name: '经典留白',
        slots: 1,
        type: 'single',
        desc: '单图简约'
      },
      {
        id: 5,
        name: '双影相依',
        slots: 2,
        type: 'dual',
        desc: '双图排列'
      },
      {
        id: 6,
        name: '携手同行',
        slots: 2,
        type: 'dual',
        desc: '双图并列'
      }
    ];

    let selectedTemplate = null;
    let uploadedImages = [];

    // 渲染模板
    function renderTemplates() {
      const grid = document.getElementById('templateGrid');
      grid.innerHTML = templates.map(t => `
        <div class="template-item" onclick="selectTemplate(${t.id})" id="tpl-${t.id}">
          <span class="template-tag">${t.slots}图</span>
          <div class="template-inner">
            <div class="template-preview">
              <div class="poster-mock type-${t.type}">
                <div class="poster-img-area"></div>
                <div class="poster-text-area"></div>
              </div>
            </div>
            <div class="template-info">
              <div class="template-name">${t.name}</div>
              <div class="template-slots">${t.desc}</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    // 选择模板
    function selectTemplate(id) {
      document.querySelectorAll('.template-item').forEach(el => el.classList.remove('selected'));
      document.getElementById(`tpl-${id}`).classList.add('selected');

      selectedTemplate = templates.find(t => t.id === id);
      uploadedImages = [];

      const previewSection = document.getElementById('previewSection');
      const container = document.getElementById('previewContainer');

      container.innerHTML = '';
      for (let i = 0; i < selectedTemplate.slots; i++) {
        const slotNum = i + 1;
        container.innerHTML += `
          <div class="preview-slot" id="slot-${i}" onclick="triggerUpload(${i})">
            <div class="preview-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
              </svg>
              <span>第${slotNum}张</span>
            </div>
          </div>
        `;
      }

      previewSection.classList.add('show');
      document.getElementById('confirmBtn').classList.remove('active');
      window.scrollTo({ top: previewSection.offsetTop - 20, behavior: 'smooth' });
    }

    // 触发上传
    function triggerUpload(slot) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            const slotEl = document.getElementById(`slot-${slot}`);
            slotEl.innerHTML = `<img src="${e.target.result}" alt="婚纱照">`;
            uploadedImages[slot] = e.target.result;
            checkConfirmBtn();
          };
          reader.readAsDataURL(file);
        }
      };
      input.click();
    }

    // 检查确认按钮
    function checkConfirmBtn() {
      const allFilled = uploadedImages.length >= selectedTemplate.slots && uploadedImages.every(img => img);
      const btn = document.getElementById('confirmBtn');
      allFilled ? btn.classList.add('active') : btn.classList.remove('active');
    }

    // 确认选择
    function confirmSelection() {
      if (!selectedTemplate) return;
      if (uploadedImages.length < selectedTemplate.slots || !uploadedImages.every(img => img)) return;

      document.querySelector('.section').style.display = 'none';
      document.getElementById('previewSection').classList.remove('show');
      document.getElementById('confirmBtn').style.display = 'none';
      document.getElementById('resultSection').classList.add('show');
    }

    renderTemplates();
  </script>
</body>
</html>
